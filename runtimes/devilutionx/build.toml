schema = 1
runtime = "devilutionx"

# DevilutionX is the first real engine behind the RuntimeHost ABI, chosen because it
# already builds for iOS upstream, is permissively licensed (Unlicense), needs no JIT,
# and runs at 60fps on an A13. Nothing on its path is load-bearing on an unsolved
# problem.

[source]
git = "https://github.com/diasurgical/DevilutionX"
tag = "1.5.4"
# Verified against the remote: `git ls-remote --tags` resolves 1.5.4 to this commit
# ("Bump version to 1.5.4", 2025-02-08). A tag can be moved; a commit cannot, and the
# thing being built is somebody's ability to play a game they own.
commit = "9f30593b4c2e706d6d6a66edfbc3aa6ada8861b4"
submodules = true

[build]
system = "cmake"
targets = ["libdevilutionx"]

# Upstream already carries CMake/platforms/ios.cmake, which `if(IOS)` includes. It
# turns off every DEVILUTIONX_SYSTEM_* flag, so SDL2, SDL_image, SDL_audiolib,
# libsodium, libpng and libfmt are all fetched and linked statically by the build
# itself -- and it already sets DISABLE_ZERO_TIER. Setting CMAKE_SYSTEM_NAME is
# therefore nearly the whole configuration.
# Verified: this configures successfully against the iOS 27.0 SDK with CMake 4.3.2.
# Configure takes about 3.5 minutes because it resolves every dependency from source.
cmake_args = [
  "-DCMAKE_SYSTEM_NAME=iOS",
  "-DCMAKE_OSX_ARCHITECTURES=arm64",
  "-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0",
  # Not redundant with the line above. CMakeLists.txt:384 hardcodes
  # `set(CMAKE_OSX_DEPLOYMENT_TARGET "9.0")` inside its `if(IOS)` block, which
  # clobbers the command-line value -- and Xcode 27 refuses anything below 15.0
  # ("the range of supported deployment target versions is 15.0 to 27.0.x"). Setting
  # the Xcode attribute directly wins, and avoids carrying a patch for one line.
  "-DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=15.0",
  # Required with CMake 4.x. The vendored libpng declares
  # `cmake_minimum_required(VERSION <3.5)`, and CMake 4 removed compatibility with
  # anything below 3.5. Without this the configure dies in _deps/libpng-src.
  "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
  "-DBUILD_TESTING=OFF",
]

# Porthole signs with the user's own certificate through `porthole sign`, so Xcode
# must not try. Without this the build fails at the end with "Signing for
# \"devilutionx\" requires a development team" after compiling everything.
xcode_settings = [
  "CODE_SIGNING_ALLOWED=NO",
  "CODE_SIGNING_REQUIRED=NO",
  "CODE_SIGN_IDENTITY=",
]

# The Xcode generator is the reliable choice for an iOS build; Ninja needs more
# coaxing for multi-config Apple platforms.
generator = "Xcode"
config = "Release"

# No [[dependencies]] entries on purpose. An earlier version of this file listed
# SDL2, libsodium, bzip2 and zlib as things Porthole would have to cross-compile and
# make findable. Reading the fetched source showed that is wrong, and running the
# configure confirmed it. Observed during a real iOS configure:
#
#   SDL2, SDL_image, libpng, SDL_audiolib, libsodium, simpleini
#     -> "static library from source", built by the project itself
#   bzip2
#     -> found IN THE iOS SDK as libbz2.tbd (1.0.8). An earlier note here claimed it
#        needed a cross-compile; it does not.
#   zlib
#     -> also in the SDK, as expected
#
# `porthole probe` exists to catch this kind of mistaken assumption before someone
# spends a weekend on it.

[adapter]
# The per-engine RuntimeHost adapter. Not written yet, and now the *only* substantial
# piece of work left for this runtime.
source = "src/adapter.cpp"

[patches]
series = [
  "01-libpng-apple-math-h.patch",
  "02-fmt-consteval-clang17.patch",
]

[notes]
text = """
Remaining work, now that the dependency question is settled:

1. DONE -- configures cleanly for arm64-ios. Two non-obvious flags, plus one patch:

   - CMAKE_POLICY_VERSION_MINIMUM=3.5, because CMake 4 dropped compatibility with
     libpng's declared minimum.
   - CMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=15.0, because CMakeLists.txt
     hardcodes 9.0 and Xcode 27 rejects it.
   - 01-libpng-apple-math-h.patch, because libpng 1.6.38 includes the Carbon header
     <fp.h> on anything Apple.

   Target is `devilutionx`, Xcode generator, Release config, Xcode signing disabled.

   VERIFIED: builds clean, zero errors, against the iOS 27.0 SDK. Produces a 4.1 MB
   arm64 Mach-O at minos 15.0, and -- more usefully -- the engine as a static library:

     liblibdevilutionx.a   9.5 MB, 168 objects, 1784 global text symbols
     plus SDL2, SDL2main, SDL_image, SDL_audiolib, libpng16, libsodium, libmpq,
     libsmackerdec, PKWare, fmt       14.5 MB for all 11 libraries

   The adapter's hook is already exported:
     devilution::DiabloMain(int, char**)

2. Write src/adapter.cpp. This is now the ONLY work left, and the ground is prepared:
   link the 11 static libraries above and drive `devilution::DiabloMain`. DevilutionX expects to own main()
   and the SDL event loop, and RuntimeHost requires ph_frame() to return promptly, so
   the adapter has to invert that -- either drive the engine a frame at a time or run
   it on its own thread and marshal the framebuffer across.

   DevilutionX renders through SDL, so the adapter can hand the shell an SDL surface's
   pixels directly. It is a palettised engine, which is why the ABI carries
   PH_PIX_PAL8 and the Metal renderer expands palettes on the GPU.

3. Map ph_input onto DevilutionX's input. It is a pointer-driven isometric game, so
   the isometric-touch layout should mostly work unchanged -- tap to move, tap to
   attack, hold to keep attacking.

4. Point the asset root at the user's DIABDAT.MPQ. Upstream already searches a
   configurable directory, so this should be a ph_config pass-through.
"""
