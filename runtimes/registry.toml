# Porthole runtime registry
#
# A runtime is the thing that actually plays a game. Recipes reference these by id.
#
# tier     1 native port · 2 emulated console · 3 interpreted · 4 translation layer
# ios      ready    — known to build and run on arm64-apple-ios
#          wip      — port in progress
#          planned  — no work started
# jit      none     — pure interpreter or native code, no recompiler
#          helps    — works without JIT, materially faster with it
#          required — unusable at playable speed without JIT
# gfx      metal | gles (ANGLE) | vulkan (MoltenVK) | software
#
# `rev` is pinned at build time to the commit for the named tag. The build backend
# records the resolved hash in the attribution manifest. Pinning to a moving branch
# is not permitted.

schema = 1

# ───────────────────── reference implementation (not a game) ─────────────────────

[selftest]
name = "Porthole self-test"
tier = 3
upstream = "https://github.com/alihammoud21/porthole"
version = "1.0.0"
license = "MIT"
ios = "ready"
jit = "none"
gfx = "metal"
plays = ["Nothing — it verifies the pipeline"]
notes = """
Not an emulator or an engine. The reference RuntimeHost implementation: it draws a
test pattern, visualises live input, emits a tone, and implements save states, in
about 200 lines of C that live in this repository.

It exists so the pipeline can be verified end to end -- cross-compile, bundle, sign,
install, run -- without first building a real engine's dependency tree, and so anyone
writing a new adapter has a known-good example of every part of the ABI.
"""

